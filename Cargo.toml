[package]
name = "kubernodes"
version = "1.0.0"
edition = "2021"
authors = ["KuberNodes <sdk@kubernodes.com>"]
description = "Official Rust SDK for KuberNodes — multi-chain RPC infrastructure"
license = "MIT"
repository = "https://github.com/kubernodes/sdk-rust"
keywords = ["blockchain", "ethereum", "rpc", "web3"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[dev-dependencies]
wiremock = "0.5"
tokio = { version = "1", features = ["full", "test-util"] }
